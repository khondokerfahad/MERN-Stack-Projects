<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Challenge</title>
  </head>
  <body>
    <h1>Employee Information</h1>
    <table border="1">
      <tr>
        <th colspan="2">Employee ID and Name</th>
        <th>Position</th>
        <th>Department</th>
        <th>Salary</th>
        <th>Joining Date</th>
      </tr>
      <tr>
        <td>101</td>
        <td>John Deo</td>
        <td>Manager</td>
        <td>Sales</td>
        <td>$65,000</td>
        <td>2020-01-15</td>
      </tr>
      <tr>
        <td>102</td>
        <td>Jane Smith</td>
        <td>Analyst</td>
        <td>Finance</td>
        <td>$50,000</td>
        <td>2019-03-10</td>
      </tr>
      <tr>
        <td>103</td>
        <td>Michael Johnson</td>
        <td>Developer</td>
        <td>IT</td>
        <td>$55,000</td>
        <td>2021-02-05</td>
      </tr>
      <tfoot>
        <tr>
          <td colspan="4">Total Employee</td>
          <td colspan="2">3</td>
        </tr>
        <tr>
          <td colspan="4">Average Salary</td>
          <td>$56,666.67</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
