<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forget Password</title>
    <link rel="stylesheet" href="/week_2/Practice/forget-password.css" />
  </head>
  <body>
    <div class="forget-password-container">
      <h1>Forget Password</h1>
      <h2>Enter your register mail to get OTP then submit it to next page to reset password</h2>
      <div class="input-group">
        <label for "forget-password-email">Enter email :</label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Enter Email"
          required
        >
      </div>
      <button type="submit">Get OTP</button>
    </div>
  </body>
</html>
